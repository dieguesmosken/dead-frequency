# Avisa (com PR para a Internal) quando dependências do servidor ou do CI ficam desatualizadas.
version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    target-branch: Internal
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      servidor:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: Internal
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
