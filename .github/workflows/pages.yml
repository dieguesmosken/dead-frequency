# Publica o site (pasta site/) no GitHub Pages: https://www.teuzin.com.br/dead-frequency/
# Uma vez só: Settings → Pages → Source: "GitHub Actions".
name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "Scripts/Core/GameVersion.cs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # Depois de cada build (interna ou release) o histórico muda: republica a página de versões.
  workflow_run:
    workflows: ["Internal — Pré-release", "Build e Release"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Histórico completo das builds (branch historico)
        run: |
          git fetch -q origin historico && git show FETCH_HEAD:builds.json > site/data/builds.json || echo "sem histórico ainda"
      - name: Gerar dados do site (changelog e fotos)
        run: python3 site/build.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
