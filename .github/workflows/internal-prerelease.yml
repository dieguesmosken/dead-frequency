# Compila o jogo e publica uma pré-release automática exclusiva da branch Internal.
# Roda a cada pull request mesclado na Internal. Tag: v<versão>.<N>-pre (ex.: v0.9.9.1-pre),
# com N contando os builds dessa versão (volta a 1 quando GameVersion.Current muda).
name: Internal — Pré-release

on:
  push:
    branches: [Internal]
  workflow_dispatch:

# Um build por vez: dois merges seguidos não pegam o mesmo número.
concurrency:
  group: internal-prerelease
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write      # atestado de build (provenance)
  attestations: write

env:
  GODOT_VERSION: 4.7.2
  GODOT_STATUS: stable

jobs:
  build:
    if: github.ref == 'refs/heads/Internal'
    runs-on: ubuntu-latest
    env:
      SIGNPATH_ON: ${{ secrets.SIGNPATH_API_TOKEN != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Versão do jogo
        id: ver
        run: |
          VER=$(grep -oP 'Current = "\K[0-9.]+' Scripts/Core/GameVersion.cs)
          TITLE=$(grep -oP "new\\(\"$VER\", \"[^\"]+\", \"\\K[^\"]+" Scripts/Core/GameVersion.cs | head -1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          # Próximo número de build desta versão: maior N entre as tags v$VER.N-pre + 1.
          LAST=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${VER}." --jq '.[].ref' \
            | sed -n "s|^refs/tags/v${VER//./\\.}\.\([0-9]\+\)-pre$|\1|p" | sort -n | tail -1)
          BUILD=$(( ${LAST:-0} + 1 ))
          TAG="v${VER}.${BUILD}-pre"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "Versão $VER — $TITLE · build $TAG"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-dotnet@v4
        if: steps.ver.outputs.exists == 'false'
        with:
          # 9.0 é para o APK: o template Android da Godot 4.7 não aceita net10.0.
          dotnet-version: |
            9.0.x
            10.0.x

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: 17

      - name: Baixar Godot .NET e templates de exportação
        if: steps.ver.outputs.exists == 'false'
        run: |
          set -e
          TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          BASE="https://github.com/godotengine/godot/releases/download/${TAG}"
          ALT="https://github.com/godotengine/godot-builds/releases/download/${TAG}"
          EDITOR="Godot_v${TAG}_mono_linux_x86_64.zip"
          TPZ="Godot_v${TAG}_mono_export_templates.tpz"
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o editor.zip "$BASE/$EDITOR" || curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o editor.zip "$ALT/$EDITOR"
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o templates.tpz "$BASE/$TPZ" || curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o templates.tpz "$ALT/$TPZ"
          unzip -q editor.zip -d godot
          GODOT_BIN=$(find godot -type f -name "Godot_v*_mono_linux.x86_64" | head -1)
          chmod +x "$GODOT_BIN"
          echo "GODOT=$PWD/$GODOT_BIN" >> "$GITHUB_ENV"
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}.mono"
          mkdir -p "$DEST"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$DEST/"
          ls "$DEST" | head

      - name: Versão nos executáveis (Propriedades → Detalhes no Windows)
        if: steps.ver.outputs.exists == 'false'
        run: |
          VER=${{ steps.ver.outputs.version }}
          for f in export_presets.cfg launcher/app/export_presets.cfg; do
            sed -i "s|^application/file_version=.*|application/file_version=\"$VER.${{ steps.ver.outputs.build }}\"|; s|^application/product_version=.*|application/product_version=\"$VER.${{ steps.ver.outputs.build }}\"|" "$f"
          done
          # Build exato dentro do jogo (GameVersion.Build): o atualizador do celular compara com ele.
          BUILD_TAG="${{ steps.ver.outputs.tag }}"
          sed -i "/^config\/version=/d; s|^config/name=.*|&\nconfig/version=\"${BUILD_TAG#v}\"|" project.godot
          grep -n "^config/version" project.godot

      - name: Importar assets e compilar o C#
        if: steps.ver.outputs.exists == 'false'
        run: |
          "$GODOT" --headless --import --path . || true
          dotnet build DeadFrequency.csproj -c ExportRelease || dotnet build DeadFrequency.csproj -c Release

      - name: Exportar Windows e Linux
        if: steps.ver.outputs.exists == 'false'
        run: |
          set -e
          mkdir -p build/windows build/linux
          "$GODOT" --headless --path . --export-release "Windows Desktop" build/windows/DeadFrequency.exe
          "$GODOT" --headless --path . --export-release "Linux" build/linux/DeadFrequency.x86_64
          chmod +x build/linux/DeadFrequency.x86_64

      # APK do celular (v0.10). Se falhar, o release de PC sai do mesmo jeito, só sem o APK.
      # Assinatura: com os segredos ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_USER / ANDROID_KEYSTORE_PASSWORD
      # (chave do Matheus) o APK atualiza por cima do anterior; sem eles usa uma chave de debug criada na hora,
      # e aí é preciso desinstalar a versão antiga antes de instalar a nova.
      - name: Exportar Android (APK)
        id: apk
        if: steps.ver.outputs.exists == 'false'
        continue-on-error: true
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          VER=${{ steps.ver.outputs.version }}
          TAG=${{ steps.ver.outputs.tag }}
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mkdir -p "$HOME/.config/godot" build/android
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$SDK" "$JAVA_HOME" > "$HOME/.config/godot/$f"
          done
          sed -i "s|^version/code=.*|version/code=${{ github.run_number }}|; s|^version/name=.*|version/name=\"${TAG#v}\"|" export_presets.cfg
          dotnet build DeadFrequency.csproj -p:GodotTargetPlatform=android
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore"
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$KS_USER"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$KS_PASS"
            "$GODOT" --headless --path . --export-release "Android" build/android/DeadFrequency.apk
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$RUNNER_TEMP/debug.keystore"
            export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
            export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
            "$GODOT" --headless --path . --export-debug "Android" build/android/DeadFrequency.apk
          fi
          test -s build/android/DeadFrequency.apk
          mv build/android/DeadFrequency.apk "DeadFrequency-${TAG}-android.apk"
          ls -lh DeadFrequency-${TAG}-android.apk

      - name: Compilar o launcher (Godot padrão, só GDScript)
        if: steps.ver.outputs.exists == 'false'
        run: |
          set -e
          TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          BASE="https://github.com/godotengine/godot/releases/download/${TAG}"
          ALT="https://github.com/godotengine/godot-builds/releases/download/${TAG}"
          ED="Godot_v${TAG}_linux.x86_64.zip"
          TPZ="Godot_v${TAG}_export_templates.tpz"
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o std.zip "$BASE/$ED" || curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o std.zip "$ALT/$ED"
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o std.tpz "$BASE/$TPZ" || curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o std.tpz "$ALT/$TPZ"
          unzip -q std.zip -d godot_std
          STD=$(find godot_std -type f -name "Godot_v*_linux.x86_64" | head -1)
          chmod +x "$STD"
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "$DEST"
          unzip -q std.tpz -d tpl_std
          mv tpl_std/templates/* "$DEST/"
          mkdir -p out
          "$STD" --headless --path launcher/app --import || true
          "$STD" --headless --path launcher/app --export-release "Windows Desktop" ../../out/DeadFrequencyLauncher.exe
          "$STD" --headless --path launcher/app --export-release "Linux" ../../out/DeadFrequencyLauncher.x86_64
          cp out/DeadFrequencyLauncher.exe DeadFrequencyLauncher-windows.exe
          cp out/DeadFrequencyLauncher.x86_64 DeadFrequencyLauncher-linux
          chmod +x DeadFrequencyLauncher-linux
          ls -la DeadFrequencyLauncher-*

      # ---------- Assinatura de código (SignPath Foundation). Só roda depois de configurar:
      #   Settings → Secrets: SIGNPATH_API_TOKEN · Settings → Variables: SIGNPATH_ORGANIZATION_ID,
      #   SIGNPATH_PROJECT_SLUG e SIGNPATH_POLICY_SLUG (ver docs/CODE_SIGNING.md). Sem isso, pula.
      - name: Separar os .exe para assinar
        id: unsigned
        if: steps.ver.outputs.exists == 'false' && env.SIGNPATH_ON == 'true'
        run: |
          mkdir -p unsigned
          cp build/windows/DeadFrequency.exe unsigned/
          cp DeadFrequencyLauncher-windows.exe unsigned/
      - name: Enviar para o SignPath
        id: upload-unsigned
        if: steps.unsigned.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows
          path: unsigned/
      - name: Assinar (SignPath — aguarda a aprovação manual)
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - name: Usar os .exe assinados
        if: steps.unsigned.outcome == 'success'
        run: |
          cp signed/DeadFrequency.exe build/windows/DeadFrequency.exe
          cp signed/DeadFrequencyLauncher-windows.exe DeadFrequencyLauncher-windows.exe

      - name: Empacotar, SHA256SUMS
        if: steps.ver.outputs.exists == 'false'
        run: |
          set -e
          TAG=${{ steps.ver.outputs.tag }}
          (cd build/windows && zip -qr "../../DeadFrequency-${TAG}-windows.zip" .)
          (cd build/linux && zip -qr "../../DeadFrequency-${TAG}-linux.zip" .)
          APK=$(ls DeadFrequency-${TAG}-android.apk 2>/dev/null || true)
          sha256sum DeadFrequency-${TAG}-windows.zip DeadFrequency-${TAG}-linux.zip DeadFrequencyLauncher-windows.exe DeadFrequencyLauncher-linux $APK > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Atestado de build (prova que os arquivos saíram deste repositório)
        if: steps.ver.outputs.exists == 'false'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            DeadFrequency-${{ steps.ver.outputs.tag }}-windows.zip
            DeadFrequency-${{ steps.ver.outputs.tag }}-linux.zip
            DeadFrequencyLauncher-windows.exe
            DeadFrequencyLauncher-linux

      - name: Publicar release
        if: steps.ver.outputs.exists == 'false'
        run: |
          VER=${{ steps.ver.outputs.version }}
          TAG=${{ steps.ver.outputs.tag }}
          python3 site/release_notes.py "$VER" Internal "$TAG" > notes.md
          APK=$(ls DeadFrequency-${TAG}-android.apk 2>/dev/null || true)
          gh release create "$TAG" DeadFrequency-${TAG}-windows.zip DeadFrequency-${TAG}-linux.zip DeadFrequencyLauncher-windows.exe DeadFrequencyLauncher-linux $APK SHA256SUMS.txt --title "$TAG — Internal" --notes-file notes.md --target "$GITHUB_SHA" --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
